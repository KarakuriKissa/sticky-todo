name: 🚀 StickyTodo をビルド

on:
  workflow_dispatch: # GitHub上のボタンから手動実行
  push:
    branches: [main]
    paths-ignore:
      - '**.md'

# Releases を作るには contents:write が必須 (デフォルトの GITHUB_TOKEN は read-only)
permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    # secrets コンテキストは step の if: では使えない (GitHub の仕様。使うと
    # 「Unrecognized named-value: 'secrets'」でワークフロー自体が起動しない)。
    # job の env: では使えるので、ここで一度 true/false の文字列へ落としてから
    # 各 step で env.HAS_SIGNING_KEY を見る。
    env:
      HAS_SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}

    steps:
      # ── 1. ソースコードを取得 ──────────────────────────────────────────
      - name: コードを取得
        uses: actions/checkout@v4

      # ── 1b. バージョンを算出してファイルへ反映 ─────────────────────────
      #       自動更新(Tauri updater)は semver 比較なので、0.1.0 に固定したままだと
      #       「常に最新扱い」になり更新を検知できない。0.1.<run番号> を実ビルドの
      #       バージョンにする(コミットには反映しない。CIのチェックアウト内だけの変更)
      - name: バージョンを算出して反映
        id: version
        shell: pwsh
        run: |
          # Get-Content/Set-Content は既定でシステムのANSIコードページを使うため、
          # 日本語(tauri.conf.jsonの "Sticky ToDo β" 等)を経由すると文字化けする。
          # .NET の File.ReadAllText/WriteAllText(UTF8, BOM無し)で明示的に扱うこと
          $utf8NoBom = New-Object System.Text.UTF8Encoding $false
          function Update-FileText($path, $pattern, $replacement) {
            $text = [System.IO.File]::ReadAllText($path)
            $text = $text -replace $pattern, $replacement
            [System.IO.File]::WriteAllText($path, $text, $utf8NoBom)
          }

          $ver = "0.1.${{ github.run_number }}"
          Write-Host "Version: $ver"
          "version=$ver" >> $env:GITHUB_OUTPUT

          Update-FileText "src-tauri/tauri.conf.json" '"version": "0\.1\.0"' "`"version`": `"$ver`""
          Update-FileText "package.json" '"version": "0\.1\.0"' "`"version`": `"$ver`""
          Update-FileText "src-tauri/Cargo.toml" '(?m)^version = "0\.1\.0"' "version = `"$ver`""

      # ── 1c. 署名鍵が Secrets に設定されている時だけ、自己更新の署名生成を有効化 ──
      #       鍵が無い状態では createUpdaterArtifacts を false のままにして
      #       (=今まで通り)ビルドを壊さない。TAURI_SIGNING_PRIVATE_KEY を
      #       Secrets に追加すると、次のビルドから自動でここが有効になる
      - name: 自己更新の署名を有効化 (Secrets設定時のみ)
        if: env.HAS_SIGNING_KEY == 'true'
        shell: pwsh
        run: |
          $utf8NoBom = New-Object System.Text.UTF8Encoding $false
          $path = "src-tauri/tauri.conf.json"
          $text = [System.IO.File]::ReadAllText($path)
          $text = $text -replace '"active": true,', '"active": true, "createUpdaterArtifacts": true,'
          [System.IO.File]::WriteAllText($path, $text, $utf8NoBom)
          Write-Host "✅ createUpdaterArtifacts を有効化しました"

      # ── 2. Node.js セットアップ ────────────────────────────────────────
      - name: Node.js セットアップ
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      # ── 3. Rust セットアップ ───────────────────────────────────────────
      - name: Rust セットアップ
        uses: dtolnay/rust-toolchain@stable

      # ── 4. Rust ビルドキャッシュ（2回目以降を高速化）──────────────────
      - name: Rust キャッシュ
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      # ── 5. アイコン元画像の確認 ───────────────────────────────────────
      #
      # 以前はここで PowerShell が仮アイコン（黄色い付箋の簡易図形）を描いて
      # icon-source.png を上書きしていた。そのため、リポジトリにコミットした
      # 本物のアイコンがビルドの度に捨てられていた。
      # いまは commit 済みの src-tauri/icons/icon-source.png をそのまま使う。
      # アイコンを差し替えるときはその PNG を置き換えてコミットすること。
      - name: アイコン元画像を確認
        shell: pwsh
        run: |
          $p = "src-tauri/icons/icon-source.png"
          if (-not (Test-Path $p)) {
            throw "$p がありません。アイコン元画像をコミットしてください。"
          }
          Add-Type -AssemblyName System.Drawing
          $bmp = [System.Drawing.Bitmap]::FromFile((Resolve-Path $p))
          Write-Host ("アイコン元画像: {0}x{1}" -f $bmp.Width, $bmp.Height)
          if ($bmp.Width -lt 512 -or $bmp.Height -lt 512) {
            $bmp.Dispose()
            throw "アイコン元画像が小さすぎます（512x512 以上が必要）。"
          }
          $bmp.Dispose()

      # ── 6. 依存パッケージをインストール ───────────────────────────────
      - name: 依存パッケージをインストール
        run: npm install --force

      # ── 6b. ユニットテスト (bun test) ─────────────────────────────────
      - name: Bun セットアップ
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: テストを実行
        run: bun test tests/

      # ── 7. Tauri 用アイコンを全サイズ生成 ─────────────────────────────
      - name: Tauri アイコンを生成
        run: npm run tauri icon src-tauri/icons/icon-source.png

      # ── 8. アプリをビルド ──────────────────────────────────────────────
      #      TAURI_SIGNING_* は Secrets が未設定なら空文字のまま渡るだけで、
      #      createUpdaterArtifacts が false の間は参照されないので無害
      - name: アプリをビルド
        env:
          VITE_BUILD_NUMBER: ${{ github.run_number }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build

      # ── 9. 配布ファイル名を分かりやすくリネーム ──────────────────────
      - name: 配布ファイル名を整える（Windows）
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-files | Out-Null
          $nsis = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          $msi  = Get-ChildItem src-tauri/target/release/bundle/msi/*.msi  | Select-Object -First 1
          # ASCII filenames only — Japanese characters break GitHub release asset upload.
          if ($nsis) { Copy-Item $nsis.FullName "release-files/StickyTodo-Windows-Setup.exe" -Force }
          if ($msi)  { Copy-Item $msi.FullName  "release-files/StickyTodo-Windows.msi" -Force }
          Copy-Item src-tauri/target/release/sticky-todo.exe "release-files/StickyTodo-Windows-Portable.exe" -Force

      # ── 9b. 自己更新用の latest.json を生成（署名が有効な時だけ）。
      #        Tauri updater プラグインはこのファイルを releases/latest/download/
      #        経由で読みに行き、埋め込み公開鍵で署名を検証してから更新する。
      #        Windows(NSISインストーラー)のみ対応。Mac は対象外(手動ダウンロードのまま)
      - name: latest.json を生成 (Secrets設定時のみ)
        if: env.HAS_SIGNING_KEY == 'true'
        shell: pwsh
        run: |
          $sig = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe.sig | Select-Object -First 1
          if (-not $sig) { throw "署名ファイル(.sig)が見つかりません。createUpdaterArtifacts が有効か確認してください" }
          $signature = ([System.IO.File]::ReadAllText($sig.FullName)).Trim()

          $manifest = [ordered]@{
            version   = "${{ steps.version.outputs.version }}"
            # CI実行環境の既定コードページ次第では日本語リテラルが化ける可能性があるため、
            # ユーザーに直接表示されるこの文言だけは英数字のみにしておく(安全側)
            notes     = "See CHANGELOG.md for details: https://github.com/KarakuriKissa/sticky-todo/blob/main/CHANGELOG.md"
            pub_date  = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = [ordered]@{
              "windows-x86_64" = [ordered]@{
                signature = $signature
                url       = "https://github.com/KarakuriKissa/sticky-todo/releases/download/build-${{ github.run_number }}/StickyTodo-Windows-Setup.exe"
              }
            }
          }
          $utf8NoBom = New-Object System.Text.UTF8Encoding $false
          $json = $manifest | ConvertTo-Json -Depth 10
          [System.IO.File]::WriteAllText("release-files/latest.json", $json, $utf8NoBom)
          Write-Host "✅ latest.json を生成しました:"
          Write-Host $json

      # ── 10. 成果物をアーティファクトとして渡す（Releaseは後段の release ジョブで一括公開）
      - name: 📦 Windows 成果物をアップロード
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          retention-days: 90
          path: release-files/*

  # ════════════════════════════════════════════════════════════════════════
  #  macOS ビルド（.dmg / .app）— Apple Silicon + Intel ユニバーサル
  # ════════════════════════════════════════════════════════════════════════
  build-macos:
    runs-on: macos-latest
    steps:
      - name: コードを取得
        uses: actions/checkout@v4

      - name: Node.js セットアップ
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Bun セットアップ
        uses: oven-sh/setup-bun@v2

      - name: Rust セットアップ（Intel+ARM両対応）
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Rust キャッシュ
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: 依存パッケージをインストール
        run: bun install

      - name: Tauri アイコンを生成（コミット済みソースから）
        run: bunx tauri icon src-tauri/icons/icon-source.png

      - name: アプリをビルド（ユニバーサル）
        env:
          VITE_BUILD_NUMBER: ${{ github.run_number }}
        run: bunx tauri build --target universal-apple-darwin

      - name: 配布ファイル名を整える（Mac）
        run: |
          mkdir -p release-files
          dmg=$(ls src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg | head -n1)
          cp "$dmg" "release-files/StickyTodo-Mac.dmg"

      - name: 📦 Mac 成果物をアップロード
        uses: actions/upload-artifact@v4
        with:
          name: release-macos
          retention-days: 90
          path: release-files/StickyTodo-Mac.dmg

  # ════════════════════════════════════════════════════════════════════════
  #  Release 公開（両ビルド完了後に 1 回だけ。並列実行による競合を防ぐ）
  # ════════════════════════════════════════════════════════════════════════
  release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: 成果物をダウンロード
        uses: actions/download-artifact@v4
        with:
          path: dl

      - name: ファイルを集約
        run: |
          mkdir -p out
          cp dl/release-windows/* out/ 2>/dev/null || true
          cp dl/release-macos/* out/ 2>/dev/null || true
          ls -la out

      - name: 📦 GitHub Release を公開
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: StickyTodo v${{ needs.build-windows.outputs.version }} (build #${{ github.run_number }})
          body: |
            自動生成されたビルドです。

            ## ダウンロード
            - **Windows（推奨）**: `StickyTodo-Windows-Setup.exe`（インストーラー。2回目以降はアプリ内の「更新を確認」で自動更新されます）
            - **Windows（その他）**: `StickyTodo-Windows.msi` / `StickyTodo-Windows-Portable.exe`（インストール不要・単体。自動更新の対象外）
            - **Mac**: `StickyTodo-Mac.dmg`（Intel / Apple Silicon 両対応。自動更新の対象外・手動ダウンロード）

            ## 補足
            - バージョン: v${{ needs.build-windows.outputs.version }}（ビルド番号 #${{ github.run_number }}）
            - ⚠ β版・無署名のため、初回インストール時に警告が出ます。
              - Windows: SmartScreen →「詳細情報」→「実行」
              - Mac: アプリを右クリック →「開く」
          draft: false
          # prerelease: false が必須。GitHubの `releases/latest`（このリポジトリの
          # tauri.conf.json の updater.endpoints が使っている「常に最新を指すURL」）は
          # prerelease=true のリリースを一切対象にしない。過去ずっと true だったため、
          # 自動更新エンドポイントは実際には一度も解決できていなかった(実測: 404)。
          # 「β版」の告知はボディ本文の注記で十分伝わる
          prerelease: false
          files: |
            out/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
