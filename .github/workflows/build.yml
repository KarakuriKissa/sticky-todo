name: 🚀 StickyTodo をビルド

on:
  workflow_dispatch: # GitHub上のボタンから手動実行

# Releases を作るには contents:write が必須 (デフォルトの GITHUB_TOKEN は read-only)
permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      # ── 1. ソースコードを取得 ──────────────────────────────────────────
      - name: コードを取得
        uses: actions/checkout@v4

      # ── 2. Node.js セットアップ ────────────────────────────────────────
      - name: Node.js セットアップ
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      # ── 3. Rust セットアップ ───────────────────────────────────────────
      - name: Rust セットアップ
        uses: dtolnay/rust-toolchain@stable

      # ── 4. Rust ビルドキャッシュ（2回目以降を高速化）──────────────────
      - name: Rust キャッシュ
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      # ── 5. アイコン生成（PowerShell で PNG を作成）────────────────────
      - name: アプリアイコンを生成
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "src-tauri/icons" | Out-Null
          Add-Type -AssemblyName System.Drawing

          $size = 1240
          $bmp  = New-Object System.Drawing.Bitmap $size, $size
          $g    = [System.Drawing.Graphics]::FromImage($bmp)
          $g.SmoothingMode = [System.Drawing.Drawing2D.SmoothingMode]::AntiAlias

          # 背景：付箋イエロー
          $g.Clear([System.Drawing.Color]::FromArgb(254, 240, 138))

          # 白い付箋本体
          $white = New-Object System.Drawing.SolidBrush(
            [System.Drawing.Color]::FromArgb(220, 255, 255, 255))
          $g.FillRectangle($white, 155, 200, 930, 840)

          # タスク行（3本）
          $linePen = New-Object System.Drawing.Pen(
            [System.Drawing.Color]::FromArgb(30, 30, 46), 52)
          $linePen.StartCap = [System.Drawing.Drawing2D.LineCap]::Round
          $linePen.EndCap   = [System.Drawing.Drawing2D.LineCap]::Round
          $g.DrawLine($linePen, 300, 420, 980, 420)
          $g.DrawLine($linePen, 300, 570, 900, 570)
          $g.DrawLine($linePen, 300, 720, 760, 720)

          # チェックボックス（1つ塗りつぶし）
          $cbPen = New-Object System.Drawing.Pen(
            [System.Drawing.Color]::FromArgb(99, 102, 241), 38)
          $g.DrawRectangle($cbPen, 230, 394, 52, 52)
          $filled = New-Object System.Drawing.SolidBrush(
            [System.Drawing.Color]::FromArgb(99, 102, 241))
          $g.FillRectangle($filled, 234, 544, 44, 44)
          $g.DrawRectangle($cbPen, 230, 694, 52, 52)

          $g.Dispose()
          $bmp.Save("src-tauri/icons/icon-source.png",
            [System.Drawing.Imaging.ImageFormat]::Png)
          $bmp.Dispose()
          Write-Host "✅ アイコン元画像を生成しました"

      # ── 6. 依存パッケージをインストール ───────────────────────────────
      - name: 依存パッケージをインストール
        run: npm install --force

      # ── 6b. ユニットテスト (bun test) ─────────────────────────────────
      - name: Bun セットアップ
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: テストを実行
        run: bun test tests/

      # ── 7. Tauri 用アイコンを全サイズ生成 ─────────────────────────────
      - name: Tauri アイコンを生成
        run: npm run tauri icon src-tauri/icons/icon-source.png

      # ── 8. アプリをビルド ──────────────────────────────────────────────
      - name: アプリをビルド
        run: npm run tauri build

      # ── 9. 配布ファイル名を分かりやすくリネーム ──────────────────────
      - name: 配布ファイル名を整える（Windows）
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-files | Out-Null
          $nsis = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          $msi  = Get-ChildItem src-tauri/target/release/bundle/msi/*.msi  | Select-Object -First 1
          if ($nsis) { Copy-Item $nsis.FullName "release-files/StickyTodo-Windows-インストーラー.exe" -Force }
          if ($msi)  { Copy-Item $msi.FullName  "release-files/StickyTodo-Windows.msi" -Force }
          Copy-Item src-tauri/target/release/sticky-todo.exe "release-files/StickyTodo-Windows-単体版.exe" -Force

      # ── 10. 成果物をアーティファクトとして渡す（Releaseは後段の release ジョブで一括公開）
      - name: 📦 Windows 成果物をアップロード
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          retention-days: 90
          path: release-files/*

  # ════════════════════════════════════════════════════════════════════════
  #  macOS ビルド（.dmg / .app）— Apple Silicon + Intel ユニバーサル
  # ════════════════════════════════════════════════════════════════════════
  build-macos:
    runs-on: macos-latest
    steps:
      - name: コードを取得
        uses: actions/checkout@v4

      - name: Node.js セットアップ
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Bun セットアップ
        uses: oven-sh/setup-bun@v2

      - name: Rust セットアップ（Intel+ARM両対応）
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Rust キャッシュ
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: 依存パッケージをインストール
        run: bun install

      - name: Tauri アイコンを生成（コミット済みソースから）
        run: bunx tauri icon src-tauri/icons/icon-source.png

      - name: アプリをビルド（ユニバーサル）
        run: bunx tauri build --target universal-apple-darwin

      - name: 配布ファイル名を整える（Mac）
        run: |
          mkdir -p release-files
          dmg=$(ls src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg | head -n1)
          cp "$dmg" "release-files/StickyTodo-Mac.dmg"

      - name: 📦 Mac 成果物をアップロード
        uses: actions/upload-artifact@v4
        with:
          name: release-macos
          retention-days: 90
          path: release-files/StickyTodo-Mac.dmg

  # ════════════════════════════════════════════════════════════════════════
  #  Release 公開（両ビルド完了後に 1 回だけ。並列実行による競合を防ぐ）
  # ════════════════════════════════════════════════════════════════════════
  release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: 成果物をダウンロード
        uses: actions/download-artifact@v4
        with:
          path: dl

      - name: ファイルを集約
        run: |
          mkdir -p out
          cp dl/release-windows/* out/ 2>/dev/null || true
          cp dl/release-macos/* out/ 2>/dev/null || true
          ls -la out

      - name: 📦 GitHub Release を公開
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: StickyTodo build #${{ github.run_number }}
          body: |
            自動生成されたビルドです。

            ## ダウンロード
            - **Windows**: `StickyTodo-Windows-インストーラー.exe`（推奨）/ `StickyTodo-Windows.msi` / `StickyTodo-Windows-単体版.exe`（インストール不要）
            - **Mac**: `StickyTodo-Mac.dmg`（Intel / Apple Silicon 両対応）

            ## 補足
            - ビルド番号: #${{ github.run_number }}
            - ⚠ β版・無署名のため、初回起動時に警告が出ます。
              - Windows: SmartScreen →「詳細情報」→「実行」
              - Mac: アプリを右クリック →「開く」
          draft: false
          prerelease: true
          files: |
            out/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
